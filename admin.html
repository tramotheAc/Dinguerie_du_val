<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="version" content="643c072a0f">
  <title>Administration – La dinguerie de val</title>
  <meta name="description" content="Paramétrage du calculateur : barèmes, seuils, formules de calcul, liens pré-remplis.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2329467b'/%3E%3Ctext x='16' y='21' font-family='Arial' font-weight='700' font-size='13' fill='white' text-anchor='middle'%3EDV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/charte/jetons.css?v=643c072a0f">
  <link rel="stylesheet" href="css/charte/bandeau.css?v=643c072a0f">
  <link rel="stylesheet" href="css/charte/socle.css?v=643c072a0f">
  <link rel="stylesheet" href="css/charte/composants.css?v=643c072a0f">
  <link rel="stylesheet" href="css/charte/bouton-theme.css?v=643c072a0f">
  <link rel="stylesheet" href="css/charte/motif-rail.css?v=643c072a0f">
  <link rel="stylesheet" href="css/categories.css?v=643c072a0f">
  <link rel="stylesheet" href="css/app.css?v=643c072a0f">
  <link rel="stylesheet" href="css/admin.css?v=643c072a0f">
</head>
<body class="page-admin">
  <div class="app">
    <aside class="rail" id="rail">
      <div class="marque">
        <div class="pastille" aria-hidden="true">DV</div>
        <div class="marque-texte">
          <h1 id="titre-app">La dinguerie de val</h1>
          <p>Administration du paramétrage</p>
        </div>
        <button type="button" class="bascule-nav" aria-expanded="false" aria-controls="nav-admin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          Menu
        </button>
      </div>
      <ul class="nav" id="nav-admin"></ul>
      <div class="rail-pied">
        <a class="retour-calculateur" href="index.html">← Retour au calculateur</a>
        Les réglages ne contiennent aucune donnée de ménage : seulement des barèmes, des seuils et des formules.
      </div>
    </aside>

    <main class="scene" id="scene">
      <div class="barre-admin" id="barre-admin"></div>
      <div id="panneau" class="panneau"></div>
    </main>
  </div>

  <div class="parametres" role="group" aria-label="Réglages d'affichage">
    <span class="parametres-titre">Affichage</span>
    <button type="button" id="bascule-theme" class="bascule-theme" data-effectif="light" aria-label="Passer au thème sombre">
      <svg class="i-soleil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9 19 19M19 5l-2.1 2.1M7.1 16.9 5 19"/></svg>
      <svg class="i-lune" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5Z"/></svg>
    </button>
  </div>

  <!-- Si les scripts ne demarrent pas (fichier ancien garde en cache, reseau
       coupe), on le dit au lieu de laisser des boutons sans effet. -->
  <script>
    setTimeout(function () {
      if (window.dinguerieDemarree) return;
      var d = document.createElement('div');
      d.className = 'bandeau rouge';
      d.setAttribute('role', 'alert');
      d.innerHTML = '<div><strong>La page n\u2019a pas fini de se charger.</strong> Actualisez-la sans le cache : Ctrl + F5 (Cmd + Maj + R sur Mac).</div>';
      var z = document.getElementById('bandeaux') || document.getElementById('barre-admin');
      if (z) z.prepend(d);
    }, 6000);
  </script>
  <script src="js/bouton-theme.js?v=643c072a0f"></script>
  <script type="module" src="js/admin.js?v=643c072a0f"></script>
</body>
</html>
